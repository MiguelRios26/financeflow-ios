workflows:
  ios-capacitor:
    name: FinanceFlow iOS (Capacitor)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: appstore_credentials
    environment:
      groups:
        - certificate_signing
      vars:
        BUNDLE_ID: "com.miguelrios.financeflow"
        XCODE_WORKSPACE: "App.xcworkspace"
        XCODE_SCHEME: "App"
      node: latest
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install npm dependencies
        script: npm install
      - name: Add iOS platform (Capacitor)
        script: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi
      - name: Sync Capacitor
        script: npx cap sync ios
      - name: Set export compliance flag
        script: |
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" ios/App/App/Info.plist || \
          /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" ios/App/App/Info.plist
      - name: Add microphone and speech recognition permissions
        script: |
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string 'Precisamos do microfone para registrar transações por comando de voz.'" ios/App/App/Info.plist || \
          /usr/libexec/PlistBuddy -c "Set :NSMicrophoneUsageDescription Precisamos do microfone para registrar transações por comando de voz." ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSSpeechRecognitionUsageDescription string 'Usamos reconhecimento de voz para transformar sua fala em lançamentos financeiros.'" ios/App/App/Info.plist || \
          /usr/libexec/PlistBuddy -c "Set :NSSpeechRecognitionUsageDescription Usamos reconhecimento de voz para transformar sua fala em lançamentos financeiros." ios/App/App/Info.plist
      - name: Install CocoaPods dependencies
        script: |
          cd ios/App && pod install
      - name: Set up keychain
        script: keychain initialize
      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
      - name: Set up signing certificate
        script: keychain add-certificates
      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles
      - name: Increment build number
        script: |
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-app-store-build-number "$BUNDLE_ID" 2>/dev/null || echo 0)
          CANDIDATE=$((LATEST_BUILD_NUMBER + 1))
          if [ "$BUILD_NUMBER" -gt "$CANDIDATE" ]; then
            NEW_BUILD_NUMBER=$BUILD_NUMBER
          else
            NEW_BUILD_NUMBER=$CANDIDATE
          fi
          echo "Latest App Store build: $LATEST_BUILD_NUMBER | Codemagic build counter: $BUILD_NUMBER | Using: $NEW_BUILD_NUMBER"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $NEW_BUILD_NUMBER" ios/App/App/Info.plist
          cat ios/App/App/Info.plist | grep -A1 CFBundleVersion
      - name: Build ipa for distribution
        script: |
          xcode-project build-ipa --workspace "ios/App/$XCODE_WORKSPACE" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

